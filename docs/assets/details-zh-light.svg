<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">页码、密度与背景字</title>
<desc id="desc">页码显示整份文稿或当前章节的进度。进度密度控制页标合并方式。顶部停靠时，非当前章的背景字可显示在章节标题和页标后方。</desc>
<rect x="0" y="0" width="1000" height="490" rx="0" fill="#FAF8F4"/>
<rect x="0" y="0" width="10" height="490" rx="0" fill="#A32342"/>
<text x="42" y="59" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="33" font-weight="700" letter-spacing="-0.7" text-anchor="start">页码、密度与背景字</text>
<path d="M42 82L958 82" fill="none" stroke="#22252A" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M493 108L493 455" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42" y="130" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="24" font-weight="680" letter-spacing="0" text-anchor="start">进度计数</text>
<text x="42" y="193" fill="#A32342" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="48" font-weight="680" letter-spacing="-2" text-anchor="start">12/40</text>
<text x="42" y="224" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">全局页码</text>
<text x="257" y="193" fill="#A32342" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="48" font-weight="680" letter-spacing="-2" text-anchor="start">2/8</text>
<text x="257" y="224" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">章节页码</text>
<path d="M42 252L463 252" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42" y="289" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="23" font-weight="680" letter-spacing="0" text-anchor="start">进度密度</text>
<text x="42" y="328" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="610" letter-spacing="0" text-anchor="start">全部页面</text>
<text x="462" y="328" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="end">每页一个页标</text>
<path d="M42 341L463 341" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42" y="373" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="610" letter-spacing="0" text-anchor="start">自动密度</text>
<text x="462" y="373" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="end">空间不足时合并页标</text>
<path d="M42 386L463 386" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42" y="418" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="610" letter-spacing="0" text-anchor="start">聚焦当前章节</text>
<text x="462" y="418" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="end">其他章各用一条汇总条</text>
<path d="M42 431L463 431" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="525" y="130" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="23" font-weight="680" letter-spacing="0" text-anchor="start">裁切背景字（顶部）</text>
<text x="525" y="166" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">仅用于顶部停靠的非当前章节。</text>
<rect x="525" y="199" width="398" height="48" rx="0" fill="#FAF8F4" stroke="#CDCAC4" stroke-width="1"/>
<circle cx="545" cy="223" r="5" fill="#515960"/>
<text x="562" y="231" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="19" font-weight="480" letter-spacing="0" text-anchor="start">章节标题与页标</text>
<rect x="540" y="254" width="383" height="48" rx="0" fill="#F4E4E5" stroke="#CDCAC4" stroke-width="1"/>
<circle cx="560" cy="278" r="5" fill="#A32342"/>
<text x="577" y="286" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="19" font-weight="650" letter-spacing="0" text-anchor="start">裁切后的章节名</text>
<rect x="555" y="309" width="368" height="48" rx="0" fill="#FAF8F4" stroke="#CDCAC4" stroke-width="1"/>
<circle cx="575" cy="333" r="5" fill="#515960"/>
<text x="592" y="341" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="19" font-weight="480" letter-spacing="0" text-anchor="start">章节底色</text>
<text x="525" y="400" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">背景字颜色和透明度（0% 至 100%）</text>
<text x="525" y="430" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">背景字缩放比例（110% 至 300%）</text>
</svg>
