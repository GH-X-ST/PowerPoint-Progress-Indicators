<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" width="1000" height="524" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">保存进度条样式，更新选中的幻灯片</title>
<desc id="desc">每份文稿最多可保存 32 套进度条设置。移除的进度条可以重新生成，手动隐藏的进度条则会在下次生成时保持隐藏。</desc>
<rect x="0" y="0" width="1000" height="524" rx="0" fill="#FAF8F4"/>
<rect x="0" y="0" width="10" height="524" rx="0" fill="#A32342"/>
<text x="42" y="59" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="33" font-weight="700" letter-spacing="-0.7" text-anchor="start">保存进度条样式，更新选中的幻灯片</text>
<path d="M42 82L958 82" fill="none" stroke="#22252A" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M459 105L459 337" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42" y="132" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="23" font-weight="680" letter-spacing="0" text-anchor="start">每份文稿最多可保存</text>
<text x="38" y="219" fill="#A32342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="80" font-weight="730" letter-spacing="-4" text-anchor="start">32</text>
<text x="153" y="173" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="20" font-weight="620" letter-spacing="0" text-anchor="start">套进度条设置</text>
<text x="153" y="204" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">在“我的文档预设”中按名称选择</text>
<text x="42" y="263" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">调好颜色、字号和页标后，为这套设置命名。</text>
<text x="42" y="287" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">下次选中预设，点击“应用”后再生成。</text>
<text x="42" y="325" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">要在另一份文稿中使用当前设置，先导出，再导入。</text>
<text x="490" y="132" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="23" font-weight="680" letter-spacing="0" text-anchor="start">只修改选中的幻灯片</text>
<text x="490" y="174" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="620" letter-spacing="0" text-anchor="start">更新所选页</text>
<text x="956" y="174" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="end">按当前设置重画进度条</text>
<path d="M490 187L956 187" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="490" y="217" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="620" letter-spacing="0" text-anchor="start">移除所选页导航</text>
<text x="956" y="217" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="end">删除进度条，下次可以重新生成</text>
<path d="M490 230L956 230" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="490" y="260" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="620" letter-spacing="0" text-anchor="start">所选页不显示导航</text>
<text x="956" y="260" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="end">立即隐藏，再次生成时仍然隐藏</text>
<path d="M490 273L956 273" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="490" y="303" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="620" letter-spacing="0" text-anchor="start">恢复所选页显示</text>
<text x="956" y="303" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="end">取消隐藏，按该页的规则显示</text>
<text x="490" y="340" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">更新和移除只影响指定页码范围内的所选页。</text>
<path d="M490 316L956 316" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="42" y="369" width="916" height="120" rx="0" fill="#F4E4E5"/>
<text x="61" y="403" fill="#A32342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="21" font-weight="670" letter-spacing="0" text-anchor="start">复用同章导航</text>
<text x="531" y="403" fill="#A32342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="21" font-weight="670" letter-spacing="0" text-anchor="start">上次生成统计</text>
<path d="M509 388L509 468" fill="none" stroke="#CDCAC4" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="61" y="433" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">同章的幻灯片可以共用进度条布局和阴影。</text>
<text x="61" y="457" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">每一页仍会标出当前位置，页标也保留各自的链接。</text>
<text x="531" y="433" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">查看这次生成用了多久、多少页共用了布局，</text>
<text x="531" y="457" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">以及重复使用了多少次阴影图。</text>
</svg>
