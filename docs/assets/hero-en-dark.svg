<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">PowerPoint Progress Indicators</title>
<desc id="desc">Section titles and slide markers link to slides during a PowerPoint slide show. The add-in includes 40 design presets, three sizes, and four dock edges.</desc>
<rect x="0" y="0" width="1200" height="550" rx="0" fill="#11171E"/>
<text x="52" y="63" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="650" letter-spacing="-0.5" text-anchor="start">PowerPoint add-in</text>
<text x="1148" y="60" fill="#B3BBC3" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="23" font-weight="600" letter-spacing="1" text-anchor="end">VBA</text>
<rect x="0" y="101" width="1200" height="300" rx="0" fill="#F194A5"/>
<text x="50" y="227" fill="#24191E" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="102" font-weight="750" letter-spacing="-5.5" text-anchor="start">Progress</text>
<text x="50" y="331" fill="#24191E" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="102" font-weight="750" letter-spacing="-5.5" text-anchor="start">Indicators</text>
<text x="57" y="376" fill="#24191E" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="450" letter-spacing="0" text-anchor="start">Section navigation and slide progress</text>
<g transform="translate(774 56) rotate(12 170 155)">
<path d="M78 42H180L199 19H309V269L247 239L184 269V70H78Z" fill="#171C23" stroke="#171C23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M43 81H128L149 54H256V311L191 276L127 311V108H43Z" fill="#AFA4A6" stroke="#171C23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M9 115H74L104 81H205V350L135 311L66 350V151H9Z" fill="#FCF4E1" stroke="#171C23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88 147H177M88 165H150M88 183H169" fill="none" stroke="#171C23" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="53" y="493" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="52" font-weight="720" letter-spacing="-2" text-anchor="start">40</text>
<text x="141" y="489" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">design presets</text>
<text x="440" y="493" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="52" font-weight="720" letter-spacing="-2" text-anchor="start">3</text>
<text x="492" y="489" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">preset sizes</text>
<text x="829" y="493" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="52" font-weight="720" letter-spacing="-2" text-anchor="start">4</text>
