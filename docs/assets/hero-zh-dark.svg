<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">PowerPoint 演讲进度条</title>
<desc id="desc">放映时，点击章名跳到该章，点击页标跳到对应页。进度条有 40 款样式，每款有三档尺寸，可放在幻灯片的任一边。</desc>
<rect x="0" y="0" width="1200" height="550" rx="0" fill="#11171E"/>
<text x="52" y="63" fill="#F6F3EB" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="26" font-weight="650" letter-spacing="-0.5" text-anchor="start">PowerPoint 加载项</text>
<text x="1148" y="60" fill="#B3BBC3" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="23" font-weight="600" letter-spacing="1" text-anchor="end">VBA</text>
<rect x="0" y="101" width="1200" height="300" rx="0" fill="#F194A5"/>
<text x="48" y="270" fill="#24191E" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="101" font-weight="750" letter-spacing="-3" text-anchor="start">演讲进度条</text>
<text x="56" y="330" fill="#24191E" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="27" font-weight="500" letter-spacing="0" text-anchor="start">放映时，点击进度条即可跳到其他章节或页面。</text>
<g transform="translate(774 56) rotate(12 170 155)">
<path d="M78 42H180L199 19H309V269L247 239L184 269V70H78Z" fill="#171C23" stroke="#171C23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M43 81H128L149 54H256V311L191 276L127 311V108H43Z" fill="#AFA4A6" stroke="#171C23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M9 115H74L104 81H205V350L135 311L66 350V151H9Z" fill="#FCF4E1" stroke="#171C23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88 147H177M88 165H150M88 183H169" fill="none" stroke="#171C23" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="53" y="493" fill="#F6F3EB" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="52" font-weight="720" letter-spacing="-2" text-anchor="start">40</text>
<text x="141" y="489" fill="#B3BBC3" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">款导航样式</text>
<text x="440" y="493" fill="#F6F3EB" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="52" font-weight="720" letter-spacing="-2" text-anchor="start">3</text>
<text x="492" y="489" fill="#B3BBC3" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">档尺寸（小、中、大）</text>
<text x="829" y="493" fill="#F6F3EB" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="52" font-weight="720" letter-spacing="-2" text-anchor="start">4</text>
<text x="881" y="489" fill="#B3BBC3" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">个位置（上、下、左、右）</text>
<path d="M402 451L402 506" fill="none" stroke="#424A52" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M789 451L789 506" fill="none" stroke="#424A52" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
