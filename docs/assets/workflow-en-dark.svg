<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From sections to a slide show</title>
<desc id="desc">Add sections, choose a design and size, preview up to three eligible slides, and generate the indicators. During a slide show, section titles and slide markers are links.</desc>
<rect x="0" y="0" width="1000" height="395" rx="0" fill="#11171E"/>
<rect x="0" y="0" width="10" height="395" rx="0" fill="#FF9EAE"/>
<text x="42" y="59" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="35" font-weight="700" letter-spacing="-0.7" text-anchor="start">From sections to a slide show</text>
<path d="M42 82L958 82" fill="none" stroke="#F6F3EB" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(42 110)">
<rect x="0" y="0" width="57" height="53" rx="0" fill="#3C262F"/>
<path d="M12 13H43M20 21H36M12 32H43M20 40H36" fill="none" stroke="#FF9EAE" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<path d="M117 137L243 137" fill="none" stroke="#424A52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M236 132L243 137L236 142" fill="none" stroke="#B3BBC3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42" y="201" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="680" letter-spacing="-0.45" text-anchor="start">Add sections</text>
<text x="42" y="231" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Group slides in the</text>
<text x="42" y="256" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">thumbnail pane.</text>
<g transform="translate(276 110)">
<rect x="0" y="0" width="57" height="53" rx="0" fill="#3C262F"/>
<path d="M12 17L29 10L45 17L29 24ZM12 26L29 33L45 26M12 35L29 42L45 35" fill="none" stroke="#FF9EAE" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<path d="M351 137L477 137" fill="none" stroke="#424A52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470 132L477 137L470 142" fill="none" stroke="#B3BBC3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="276" y="201" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="680" letter-spacing="-0.45" text-anchor="start">Design Presets</text>
<text x="276" y="231" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Open a design, then</text>
<text x="276" y="256" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">choose its size.</text>
<g transform="translate(510 110)">
<rect x="0" y="0" width="57" height="53" rx="0" fill="#3C262F"/>
<path d="M7 27Q28 3 50 27Q28 50 7 27Z" fill="none" stroke="#FF9EAE" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="29" cy="27" r="5" fill="#FF9EAE"/>
</g>
<path d="M585 137L711 137" fill="none" stroke="#424A52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M704 132L711 137L704 142" fill="none" stroke="#B3BBC3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="510" y="201" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="680" letter-spacing="-0.45" text-anchor="start">Preview</text>
<text x="510" y="231" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Check up to three</text>
<text x="510" y="256" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">eligible slides.</text>
<g transform="translate(744 110)">
<rect x="0" y="0" width="57" height="53" rx="0" fill="#3C262F"/>
<path d="M14 12H34L42 20V40H14ZM34 12V20H42" fill="none" stroke="#FF9EAE" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M20 30L25 35L35 24" fill="none" stroke="#FF9EAE" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="744" y="201" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="680" letter-spacing="-0.45" text-anchor="start">Generate</text>
<text x="744" y="231" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Apply indicators within</text>
<text x="744" y="256" fill="#B3BBC3" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">the selected slide range.</text>
<rect x="42" y="289" width="916" height="75" rx="0" fill="#3C262F"/>
<text x="60" y="321" fill="#FF9EAE" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="680" letter-spacing="0" text-anchor="start">During a slide show</text>
<text x="60" y="346" fill="#F6F3EB" font-family="Inter,Arial,Helvetica,'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Select a section title to open its first slide, or select a marker to jump directly to that slide.</text>
</svg>
