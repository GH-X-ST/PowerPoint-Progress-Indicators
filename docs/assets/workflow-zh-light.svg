<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">为幻灯片添加章节导航</title>
<desc id="desc">在缩略图窗格里新增节并命名。选好样式和大小后，点“预览”查看效果。预览从指定页码范围内第一张需要显示导航的幻灯片开始，最多更新 3 页。点“生成”即可为整个指定范围更新导航。</desc>
<rect x="0" y="0" width="1000" height="395" rx="0" fill="#FAF8F4"/>
<rect x="0" y="0" width="10" height="395" rx="0" fill="#A32342"/>
<text x="42" y="59" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="33" font-weight="700" letter-spacing="-0.7" text-anchor="start">为幻灯片添加章节导航</text>
<path d="M42 82L958 82" fill="none" stroke="#22252A" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(42 110)">
<rect x="0" y="0" width="57" height="53" rx="0" fill="#F4E4E5"/>
<path d="M12 13H43M20 21H36M12 32H43M20 40H36" fill="none" stroke="#A32342" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<path d="M117 137L243 137" fill="none" stroke="#CDCAC4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M236 132L243 137L236 142" fill="none" stroke="#515960" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="42" y="201" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="23" font-weight="680" letter-spacing="-0.45" text-anchor="start">划分章节</text>
<text x="42" y="231" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">在两张缩略图之间右键，</text>
<text x="42" y="256" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">选“新增节”并命名。</text>
<g transform="translate(276 110)">
<rect x="0" y="0" width="57" height="53" rx="0" fill="#F4E4E5"/>
<path d="M12 17L29 10L45 17L29 24ZM12 26L29 33L45 26M12 35L29 42L45 35" fill="none" stroke="#A32342" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<path d="M351 137L477 137" fill="none" stroke="#CDCAC4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470 132L477 137L470 142" fill="none" stroke="#515960" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="276" y="201" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="23" font-weight="680" letter-spacing="-0.45" text-anchor="start">选择样式</text>
<text x="276" y="231" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">展开“样式预设”中的</text>
<text x="276" y="256" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">“深红层叠”，选择中号。</text>
<g transform="translate(510 110)">
<rect x="0" y="0" width="57" height="53" rx="0" fill="#F4E4E5"/>
<path d="M7 27Q28 3 50 27Q28 50 7 27Z" fill="none" stroke="#A32342" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="29" cy="27" r="5" fill="#A32342"/>
</g>
<path d="M585 137L711 137" fill="none" stroke="#CDCAC4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M704 132L711 137L704 142" fill="none" stroke="#515960" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="510" y="201" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="23" font-weight="680" letter-spacing="-0.45" text-anchor="start">预览</text>
<text x="510" y="231" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">检查章名和页标的效果，</text>
<text x="510" y="256" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">一次最多预览 3 页。</text>
<g transform="translate(744 110)">
<rect x="0" y="0" width="57" height="53" rx="0" fill="#F4E4E5"/>
<path d="M14 12H34L42 20V40H14ZM34 12V20H42" fill="none" stroke="#A32342" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M20 30L25 35L35 24" fill="none" stroke="#A32342" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="744" y="201" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="23" font-weight="680" letter-spacing="-0.45" text-anchor="start">生成导航</text>
<text x="744" y="231" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">设好起止页码后，</text>
<text x="744" y="256" fill="#515960" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">点“生成”更新进度条。</text>
<rect x="42" y="289" width="916" height="75" rx="0" fill="#F4E4E5"/>
<text x="60" y="321" fill="#A32342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="17" font-weight="680" letter-spacing="0" text-anchor="start">放映时如何跳页</text>
<text x="60" y="346" fill="#22252A" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">点章名，跳到该章第一张计入进度的幻灯片。点单个页标，直接跳到对应页。</text>
</svg>
